name: kairo
services:
  project-kairo-api:
    build: .
    container_name: project-kairo-api
    ports:
      - '${API_PORT:-5019}:3000'
    env_file:
      - .env
    environment:
      # Dentro da rede Docker o host da base é o serviço, não localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@project-kairo-database:5432/${POSTGRES_DB}?schema=public
      NODE_ENV: production
      UPLOAD_DIR: /usr/src/app/uploads
    # Startup via docker-entrypoint.sh:
    #   prisma migrate deploy (never reset)
    #   prisma db seed → users + clients + machines (insert missing only)
    #                    + cost centers (upsert from external API)
    #   npm run start
    command: ['./docker-entrypoint.sh']
    volumes:
      - project-kairo-uploads:/usr/src/app/uploads
    depends_on:
      project-kairo-database:
        condition: service_healthy
    networks:
      - project-kairo-network
    restart: unless-stopped

  project-kairo-database:
    image: postgres:16
    container_name: project-kairo-database
    ports:
      - '${DB_PORT:-5018}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - project-kairo-database:/var/lib/postgresql/data
    networks:
      - project-kairo-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  project-kairo-database:
    name: project-kairo-database
  project-kairo-uploads:
    name: project-kairo-uploads

networks:
  project-kairo-network:
    name: project-kairo-network

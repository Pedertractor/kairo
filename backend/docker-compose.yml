name: kairo
services:
  project-kairo-api:
    build: .
    container_name: project-kairo-api
    ports:
      - '5019:3000'
    env_file:
      - .env
    environment:
      # Dentro da rede Docker o host da base é o serviço, não localhost.
      DATABASE_URL: postgresql://docker:docker@project-kairo-database:5432/kairo?schema=public
      NODE_ENV: production
    depends_on:
      project-kairo-database:
        condition: service_healthy
    networks:
      - project-kairo-network
    restart: unless-stopped

  project-kairo-database:
    image: postgres:16
    container_name: project-kairo-database
    ports:
      - '5018:5432'
    environment:
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=docker
      - POSTGRES_DB=kairo
    volumes:
      - project-kairo-database:/var/lib/postgresql/data
    networks:
      - project-kairo-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U docker -d kairo']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  project-kairo-database:
    name: project-kairo-database

networks:
  project-kairo-network:
    name: project-kairo-network

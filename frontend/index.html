<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kairo — Login</title>
    <script>
      (function () {
        try {
          var p = localStorage.getItem('kairo-palette');
          if (p !== 'white' && p !== 'black' && p !== 'colorful') p = 'white';
          document.documentElement.dataset.palette = p;
          document.documentElement.classList.toggle('dark', p === 'black');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
